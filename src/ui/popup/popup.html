<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>AutoFetcher</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      color: #202124;
      background: #ffffff;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    header { display: flex; align-items: center; gap: 8px; padding-bottom: 8px; border-bottom: 1px solid #dadce0; }
    #status-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; display: inline-block; }
    #status-dot.ok { background-color: #188038; }
    #status-dot.warn { background-color: #f9ab00; }
    #status-dot.bad { background-color: #d93025; }
    #status-dot.off { background-color: #80868b; }
    #status-summary { font-weight: 600; font-size: 13px; line-height: 1.4; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #task-list { display: flex; flex-direction: column; gap: 8px; max-height: 380px; overflow-y: auto; }
    .empty-hint { color: #5f6368; font-size: 12px; line-height: 1.6; padding: 16px 8px; text-align: center; }
    .task-row { border: 1px solid #e8eaed; border-radius: 6px; padding: 8px 10px; display: flex; flex-direction: column; gap: 4px; background: #f8f9fa; }
    .task-row.disabled { opacity: 0.65; }
    .task-main { display: flex; justify-content: space-between; align-items: center; }
    .task-name { font-weight: 500; color: #202124; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; margin-right: 8px; }
    .task-value { font-weight: 600; color: #1a73e8; white-space: nowrap; }
    .task-sub { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: #5f6368; gap: 6px; }
    .task-next { font-variant-numeric: tabular-nums; }
    .task-paused { color: #80868b; font-weight: 500; }
    .task-reason { color: #d93025; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .task-actions { display: flex; gap: 6px; margin-top: 4px; }
    button { cursor: pointer; font-size: 12px; border-radius: 4px; border: 1px solid #dadce0; background: #ffffff; padding: 4px 8px; color: #3c4043; line-height: 1.2; }
    button:hover { background: #f1f3f4; }
    .retry, .open-page { font-size: 11px; padding: 2px 6px; }
    .retry { color: #1a73e8; border-color: #aecbfa; }
    .open-page { color: #5f6368; }
    footer { display: flex; justify-content: space-between; gap: 8px; padding-top: 8px; border-top: 1px solid #dadce0; }
    #toggle-all, #open-report { flex: 1; padding: 6px 10px; }
  </style>
</head>
<body>
  <header>
    <span id="status-dot" class="status-dot"></span>
    <span id="status-summary"></span>
  </header>
  <div id="task-list"></div>
  <footer>
    <button type="button" id="toggle-all">全部暫停 / 恢復</button>
    <button type="button" id="open-report">開啟報表</button>
  </footer>
  <script type="module" src="./popup.js"></script>
</body>
</html>
