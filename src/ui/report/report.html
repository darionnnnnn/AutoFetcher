<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoFetcher 報表歷史</title>
  <link rel="stylesheet" href="../theme.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; padding: 1rem; }
    .tab-nav { display: flex; gap: 0.5rem; border-bottom: 1px solid var(--border); margin-bottom: 1rem; padding-bottom: 0.5rem; }
    .tab-btn { background: transparent; border: none; padding: 0.5rem 1rem; font-size: 0.95rem; font-weight: 500; color: var(--text-muted); cursor: pointer; border-radius: var(--radius); }
    .tab-btn:hover { background: var(--hover); color: var(--text); }
    .history-layout { display: grid; grid-template-columns: 280px 1fr; gap: 1.25rem; align-items: start; }
    @media (max-width: 768px) { .history-layout { grid-template-columns: 1fr; } }
    #range-bar { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem; align-items: center; }
    #range-bar button, #range-bar input[type="date"] { background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 0.35rem 0.75rem; border-radius: var(--radius); font-size: 0.85rem; }
    #range-bar button { cursor: pointer; }
    #range-bar button:hover { background: var(--hover); border-color: var(--primary); }
    #calendar { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 0.75rem; }
    #calendar table { width: 100%; border-collapse: collapse; text-align: center; font-size: 0.85rem; }
    #calendar th { padding: 0.4rem; color: var(--text-muted); font-weight: 500; }
    #calendar td { padding: 0.5rem 0.25rem; border-radius: var(--radius); cursor: pointer; position: relative; }
    #calendar td:hover { background: var(--hover); }
    #calendar td.out-of-month { color: var(--text-muted); opacity: 0.4; }
    #calendar td.has-records::after { content: ""; position: absolute; bottom: 3px; left: 50%; transform: translateX(-50%); width: 4px; height: 4px; border-radius: 50%; background: var(--primary); }
    #calendar td.has-fail { color: var(--danger); font-weight: bold; }
    #calendar td.has-fail::after { background: var(--danger); }
    #column-config { display: flex; flex-wrap: wrap; gap: 0.75rem; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 0.6rem 0.75rem; margin-bottom: 1rem; font-size: 0.85rem; color: var(--text-muted); }
    #column-config label { display: flex; align-items: center; gap: 0.35rem; cursor: pointer; user-select: none; }
    #summary { margin-bottom: 1rem; overflow-x: auto; }
    #summary table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); font-size: 0.85rem; }
    #summary th, #summary td { padding: 0.5rem 0.75rem; text-align: right; border-bottom: 1px solid var(--border); }
    #summary th:first-child, #summary td:first-child { text-align: left; }
    #summary th { background: var(--hover); color: var(--text-muted); font-weight: 600; }
    .table-container { overflow-x: auto; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
    #record-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; text-align: left; }
    #record-table thead th { background: var(--hover); padding: 0.6rem 0.75rem; font-weight: 600; color: var(--text-muted); border-bottom: 1px solid var(--border); cursor: pointer; user-select: none; }
    #record-table thead th:hover { color: var(--primary); }
    #record-table tbody tr { border-bottom: 1px solid var(--border); cursor: pointer; }
    #record-table tbody tr:hover { background: var(--hover); }
    #record-table tbody td { padding: 0.6rem 0.75rem; }
    #record-table tbody tr.failed { background: var(--danger-bg); color: var(--danger); }
    #record-table tbody tr.detail { background: var(--hover); cursor: default; }
    #record-table tbody tr.detail td { padding: 0.75rem 1rem; }
    .detail-box { display: flex; flex-direction: column; gap: 0.35rem; font-size: 0.85rem; font-family: monospace; }
    .detail-item { display: flex; gap: 0.5rem; }
    #empty-state { text-align: center; padding: 2.5rem 1rem; color: var(--text-muted); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
    .placeholder-panel { padding: 2rem; text-align: center; color: var(--text-muted); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
    #missed-banner { background: var(--danger-bg); border: 1px solid var(--danger); border-radius: var(--radius); padding: 0.75rem 1rem; margin-bottom: 1rem; display: flex; flex-direction: column; gap: 0.5rem; font-size: 0.9rem; }
    .missed-header { font-weight: 600; color: var(--danger); }
    .missed-items { display: flex; flex-direction: column; gap: 0.25rem; }
    .missed-item { display: flex; align-items: center; gap: 0.5rem; cursor: pointer; }
    .missed-actions { display: flex; gap: 0.5rem; margin-top: 0.25rem; }
    .task-toolbar { display: flex; gap: 0.75rem; align-items: center; margin-bottom: 1rem; }
    #task-search { background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 0.4rem 0.75rem; border-radius: var(--radius); font-size: 0.9rem; flex: 1; max-width: 320px; }
    .task-toolbar label { display: flex; align-items: center; gap: 0.35rem; font-size: 0.85rem; color: var(--text-muted); cursor: pointer; }
    #task-list { display: flex; flex-direction: column; gap: 0.5rem; }
    .task-row { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 0.6rem 0.75rem; font-size: 0.85rem; }
    .task-name { font-weight: 600; }
    .task-url { color: var(--text-muted); font-size: 0.8rem; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .task-mode, .task-schedule, .task-next, .task-status, .task-streak { color: var(--text-muted); }
    .task-actions { margin-left: auto; display: flex; gap: 0.35rem; }
    .task-actions button, .missed-actions button, .dialog-actions button { background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 0.25rem 0.5rem; border-radius: var(--radius); font-size: 0.8rem; cursor: pointer; }
    .task-actions button:hover, .missed-actions button:hover, .dialog-actions button:hover { background: var(--hover); }
    #task-delete-dialog { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem; margin-top: 1rem; }
    .dialog-actions { display: flex; gap: 0.5rem; margin-top: 0.75rem; }
  </style>
  <script type="module" src="./report.js"></script>
</head>
<body>
  <nav class="tab-nav">
    <button id="tab-dashboard" class="tab-btn" type="button">儀表板</button>
    <button id="tab-history" class="tab-btn" type="button">歷史紀錄</button>
    <button id="tab-tasks" class="tab-btn" type="button">任務管理</button>
    <button id="tab-settings" class="tab-btn" type="button">設定</button>
  </nav>

  <div id="range-bar">
    <button type="button" id="range-prev-week">«</button>
    <button type="button" id="range-prev-day">‹</button>
    <input type="date" id="range-from">
    <input type="date" id="range-to">
    <button type="button" id="range-next-day">›</button>
    <button type="button" id="range-next-week">»</button>
    <button type="button" data-range="today">今天</button>
    <button type="button" data-range="yesterday">昨天</button>
    <button type="button" data-range="last7">近 7 天</button>
    <button type="button" data-range="last30">近 30 天</button>
    <button type="button" data-range="thisMonth">本月</button>
    <button type="button" data-range="lastMonth">上月</button>
  </div>

  <main>
    <section id="panel-dashboard" class="placeholder-panel" hidden>儀表板將於下一輪加入</section>

    <section id="panel-history">
      <div id="filters"></div>

      <div class="history-layout">
        <aside>
          <div id="calendar"></div>
        </aside>

        <section class="main-content">
          <div id="column-config"></div>
          <div id="summary"></div>
          <div id="empty-state" hidden>目前尚無紀錄</div>
          <div class="table-container">
            <table id="record-table">
              <thead></thead>
              <tbody></tbody>
            </table>
          </div>
        </section>
      </div>
    </section>

    <section id="panel-tasks" hidden>
      <div id="missed-banner" hidden></div>

      <div class="task-toolbar">
        <input type="search" id="task-search" placeholder="搜尋任務名稱或網址...">
        <label>
          <input type="checkbox" id="task-failed-only">
          只看失敗
        </label>
      </div>

      <div id="task-list"></div>

      <div id="task-delete-dialog" hidden>
        <p class="dialog-message"></p>
        <div class="dialog-actions">
          <button type="button" data-action="cancel">取消</button>
          <button type="button" data-action="confirm">確定刪除</button>
          <button type="button" data-action="export-then-delete">先匯出再刪除</button>
        </div>
      </div>
    </section>

    <section id="panel-settings" class="placeholder-panel" hidden>設定將於下一輪加入</section>
  </main>
</body>
</html>
