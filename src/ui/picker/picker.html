<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>新增或編輯任務</title>
  <link rel="stylesheet" href="../theme.css">
  <link rel="stylesheet" href="../ui.css">
  <style>
    body {
      padding: var(--space-3, 12px);
      /* 視窗自己決定寬度：寫死寬度會讓右側空出一條、捲軸卡在畫面中間 */
      width: 100%;
      box-sizing: border-box;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    form { display: flex; flex-direction: column; flex: 1; min-height: 0; }
    .settings-body {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: var(--space-2, 10px);
      padding-right: 2px;
    }
    input[readonly] { background: var(--hover); }
    [data-picker-header] {
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex-shrink: 0;
      margin-bottom: var(--space-2, 10px);
    }
    #picker-title {
      margin: 0;
      font-size: var(--text-md, 15px);
      font-weight: 700;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #target-host {
      font-size: var(--text-xs, 12px);
      color: var(--text-muted);
      font-family: var(--font-mono, monospace);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-height: 1em;
    }
    #saved-feedback {
      display: flex;
      flex-direction: column;
      gap: var(--space-2, 8px);
      align-items: flex-start;
      padding: var(--space-3, 12px);
      color: var(--text);
      font-size: var(--text-md, 15px);
    }
    .rename-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .rename-row button { font-size: var(--text-xs, 12px); min-height: 28px; }
    .field-where {
      font-size: var(--text-xs, 12px);
      color: var(--text-muted);
      max-width: 96px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .field-result {
      font-family: var(--font-mono, monospace);
      font-size: var(--text-xs, 12px);
      color: var(--text-muted);
      min-width: 56px;
      text-align: right;
      flex-shrink: 0;
    }
    .field-result[data-state="ok"] { color: var(--ok); }
    .field-result[data-state="error"] { color: var(--danger); }
    .field-label { font-size: var(--text-xs, 12px); color: var(--text-muted); }
    #setup-summary {
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin-top: var(--space-2, 8px);
      padding: var(--space-2, 8px) var(--space-3, 12px);
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--primary);
      border-radius: var(--radius);
      font-size: var(--text-xs, 12px);
      color: var(--text);
      line-height: 1.6;
    }
    #setup-summary > div:empty { display: none; }
    .chip-row { display: flex; gap: 6px; flex-wrap: wrap; }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px var(--space-2, 8px);
      min-height: 28px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: var(--text-xs, 12px);
      color: var(--text);
    }
    .chip button {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 0 2px;
      min-height: 24px;
      line-height: 1;
      cursor: pointer;
    }
    .chip button:hover { color: var(--text); }
    /* 執行星期看起來也是 chip；DOM 仍是 checkbox，輔助技術才讀得到勾選狀態 */
    #card-types label,
    #weekdays label {
      padding: 2px var(--space-2, 8px);
      min-height: 28px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      font-size: var(--text-xs, 12px);
    }
    #card-types label:has(input:checked),
    #weekdays label:has(input:checked) {
      border-color: var(--primary);
      color: var(--primary);
    }
    .time-picker { display: flex; flex-direction: column; gap: 6px; }
    .time-picker-row { display: flex; align-items: center; gap: 6px; }
    .time-picker-row input[type="time"] { flex: 1; min-width: 0; }
    .range-sep { color: var(--text-muted); flex-shrink: 0; }
    #schedule-preview {
      font-size: var(--text-xs, 12px);
      color: var(--text-muted);
      line-height: 1.5;
      white-space: pre-line;
    }
    #card-types { display: flex; gap: 6px; flex-wrap: wrap; }
    #weekdays label, #card-types label { display: inline-flex; flex-direction: row; align-items: center; cursor: pointer; color: var(--text); }
    #preview {
      padding: var(--space-2, 8px) var(--space-3, 12px);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      min-height: 32px;
      word-break: break-all;
      font-family: var(--font-mono, monospace);
      font-size: var(--text-lg, 1.125rem);
      color: var(--text);
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #errors { color: var(--danger); font-size: var(--text-xs, 12px); white-space: pre-line; }
    #test-note { color: var(--text-muted); font-size: var(--text-xs, 12px); line-height: 1.4; }
    #block-summary { font-size: var(--text-xs, 12px); color: var(--text-muted); line-height: 1.4; }
    #preview[data-state="ok"] { border-color: var(--ok); color: var(--ok); }
    #preview[data-state="error"] { border-color: var(--danger); color: var(--danger); }
    #field-list { display: flex; flex-direction: column; gap: 6px; max-height: 220px; overflow-y: auto; counter-reset: field-row; }
    [data-field-row] { display: flex; align-items: center; gap: 6px; counter-increment: field-row; }
    /* 序號用 CSS 計數器自己算：清單是 picker.js 動態產生的，
       沒有人會去寫 data-field-index，用 attr() 會是一條永遠空白的死規則 */
    [data-field-row]::before {
      content: counter(field-row);
      font-size: var(--text-xs);
      color: var(--text-muted);
      min-width: 16px;
      text-align: right;
      flex-shrink: 0;
    }
    [data-field-row] input[type="text"] { flex: 1; min-width: 0; }
    [data-field-row] button {
      flex-shrink: 0;
      padding: var(--space-1) var(--space-2);
      font-size: var(--text-xs);
      background: transparent;
      border: none;
      color: var(--text-muted);
      min-height: 28px;
    }
    [data-field-row]:hover { background: var(--hover); border-radius: var(--radius); }
    [data-field-row] button:hover {
      background: var(--hover);
      color: var(--text);
    }
    #save-summary { font-size: var(--text-xs, 12px); color: var(--text-muted); line-height: 1.4; padding: 4px 0; }
    #pos-hint { font-size: var(--text-xs, 12px); color: var(--text-muted); line-height: 1.4; }
    .alert-desc { font-size: var(--text-xs, 12px); color: var(--text-muted); line-height: 1.4; }
    #alert-list { display: flex; flex-direction: column; gap: 6px; }
    [data-alert-row] { display: flex; align-items: center; gap: 6px; }
    [data-alert-row] select { flex: 2; }
    [data-alert-row] input[type="number"] { flex: 1.5; min-width: 0; }
    [data-alert-row] label { display: inline-flex; flex-direction: row; align-items: center; gap: 2px; white-space: nowrap; color: var(--text); font-size: var(--text-xs, 12px); cursor: pointer; }
    [data-alert-row] button {
      flex-shrink: 0;
      padding: var(--space-1) var(--space-2);
      font-size: var(--text-xs);
      background: transparent;
      border: none;
      color: var(--text-muted);
    }
    [data-alert-row] button:hover {
      background: var(--hover);
      color: var(--text);
    }
    #alert-add { align-self: flex-start; }
    #preaction-section {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: var(--space-2, 8px);
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: var(--space-2, 8px);
      background: var(--surface);
    }
    .preaction-title { font-size: var(--text-xs, 12px); font-weight: 600; padding: 0 var(--space-1, 4px); color: var(--text); }
    .preaction-desc { font-size: var(--text-xs, 12px); color: var(--text-muted); line-height: 1.4; }
    #preaction-list { display: flex; flex-direction: column; gap: 6px; }
    [data-preaction-row] { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    [data-preaction-row] select { flex: 2; min-width: 90px; }
    [data-preaction-row] input[type="number"] { flex: 1.5; min-width: 60px; }
    [data-preaction-row] button {
      flex-shrink: 0;
      padding: var(--space-1) var(--space-2);
      font-size: var(--text-xs);
      background: transparent;
      border: none;
      color: var(--text-muted);
    }
    [data-preaction-row] button:hover {
      background: var(--hover);
      color: var(--text);
    }
    .preaction-target { font-size: var(--text-xs, 12px); color: var(--text-muted); font-family: var(--font-mono, monospace); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 90px; }
    #preaction-add { align-self: flex-start; }
    #frame-hint {
      border: 1px solid var(--border);
      border-left: 3px solid var(--primary);
      border-radius: var(--radius);
      padding: var(--space-2, 8px);
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: var(--hover);
    }
    #frame-hint-text { font-size: var(--text-xs, 12px); color: var(--text); line-height: 1.5; }
    #frame-hint-actions { display: flex; gap: 6px; }
    #frame-hint-actions button { font-size: var(--text-xs, 12px); min-height: 28px; }
    details#advanced-section {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: var(--space-2, 8px);
      background: var(--surface);
    }
    details#advanced-section summary {
      font-size: var(--text-xs, 12px);
      font-weight: 600;
      cursor: pointer;
      color: var(--text);
    }
    details#advanced-section[open] {
      display: flex;
      flex-direction: column;
      gap: var(--space-2, 8px);
    }
    .checkbox-label {
      display: inline-flex;
      flex-direction: row;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      color: var(--text);
      font-size: var(--text-xs, 12px);
    }
  </style>
  <script type="module" src="./picker.js"></script>
</head>
<body>
  <div data-picker-header>
    <h2 id="picker-title">設定抓取任務</h2>
    <div id="target-host"></div>
    <label for="name" class="field-label">任務名稱</label>
    <input type="text" id="name" placeholder="替這個任務取個名字">
    <div id="setup-summary" role="status">
      <div id="summary-target"></div>
      <div id="summary-schedule"></div>
      <div id="summary-dashboard"></div>
    </div>
  </div>
  <form id="picker-form" onsubmit="return false;">
    <div class="settings-body">
      <fieldset id="block-section" hidden>
        <legend>抓什麼</legend>
        <div id="block-summary" role="status"></div>
        <div id="field-list"></div>
        <div id="field-rename" class="rename-row">
          <span class="field-label">一鍵命名</span>
          <button type="button" id="rename-col">用欄標題</button>
          <button type="button" id="rename-cell">用「列 · 欄」</button>
        </div>
        <label for="row-pos">列定位
          <select id="row-pos">
            <option value="" selected>依列標題</option>
            <option value="first">第一筆</option>
            <option value="last">最後一筆</option>
            <option value="last-1">倒數第二筆</option>
          </select>
        </label>
        <label for="col-pos">欄定位
          <select id="col-pos">
            <option value="" selected>依欄標題</option>
            <option value="first">第一筆</option>
            <option value="last">最後一筆</option>
            <option value="last-1">倒數第二筆</option>
          </select>
        </label>
        <div id="pos-hint"></div>
        <label>聚合方式
          <select id="block-aggregate">
            <option value="max">最大值</option>
            <option value="min">最小值</option>
            <option value="avg">平均</option>
            <option value="sum" selected>加總</option>
            <option value="count">筆數</option>
          </select>
        </label>
      </fieldset>
      <fieldset id="preview-section">
        <legend>先試抓看看</legend>
        <div id="preview"></div>
        <div id="errors" role="alert"></div>
        <div id="test-note" role="status"></div>
      </fieldset>
      <fieldset id="schedule-section">
        <legend>多久抓一次</legend>
        <label>排程類型
          <select id="schedule-type">
            <option value="daily" selected>每日固定時間</option>
            <option value="interval">固定間隔</option>
          </select>
        </label>
        <div data-schedule-only="daily" class="time-picker">
          <label for="time-input">執行時間</label>
          <div class="time-picker-row">
            <input type="time" id="time-input" value="09:30">
            <button type="button" id="time-add">加入</button>
          </div>
          <div id="time-chips" class="chip-row" role="list"></div>
          <!-- 事實來源仍是這個欄位（buildTask 與既有測試都讀它）；
               上面的 time 選擇器與 chip 只是它的輸入介面，兩邊一律同步 -->
          <input type="text" id="times" value="09:30" hidden>
        </div>
        <label data-schedule-only="interval">間隔時間（分鐘）<input type="number" id="every-minutes" value="15" min="1"></label>
        <div data-schedule-only="interval" id="window-block">
          <label class="checkbox-label">
            <input type="checkbox" id="window-enabled">只在某個時段內執行
          </label>
          <div id="window-fields" class="time-picker-row" hidden>
            <input type="time" id="window-from" placeholder="09:00">
            <span class="range-sep">～</span>
            <input type="time" id="window-to" placeholder="18:00">
          </div>
        </div>
        <label>執行星期</label>
        <div id="weekdays" class="chip-row">
          <label><input type="checkbox" value="1" checked>一</label>
          <label><input type="checkbox" value="2" checked>二</label>
          <label><input type="checkbox" value="3" checked>三</label>
          <label><input type="checkbox" value="4" checked>四</label>
          <label><input type="checkbox" value="5" checked>五</label>
          <label><input type="checkbox" value="6">六</label>
          <label><input type="checkbox" value="0">日</label>
        </div>
        <div id="schedule-preview" role="status"></div>
      </fieldset>
      <fieldset id="add-to-dashboard">
        <legend>抓完放哪裡</legend>
        <label>目標儀表板
          <select id="dashboard-select">
            <option value="none">不加入</option>
          </select>
        </label>
        <label>卡片型別</label>
        <div id="card-types">
          <label><input type="checkbox" value="number">數字</label>
          <label><input type="checkbox" value="line">折線</label>
          <label><input type="checkbox" value="bar">長條</label>
          <label><input type="checkbox" value="table">表格</label>
        </div>
      </fieldset>
      <details id="advanced-section">
        <summary>進階設定</summary>
        <label>目標網址<input type="text" id="url" readonly></label>
        <label>數值類型
          <select id="mode">
            <option value="number" selected>數字</option>
            <option value="text">文字</option>
            <option value="block">表格/清單區塊</option>
          </select>
        </label>
        <label>抓取策略
          <select id="strategy">
            <option value="auto" selected>自動</option>
            <option value="regex">正規表達式</option>
          </select>
        </label>
        <div id="legacy-strategy-note" class="hint" hidden></div>
      <label>正規表達式<input type="text" id="regex" placeholder="策略為正規表達式時必填"></label>
        <fieldset id="alert-section">
          <legend>告警條件</legend>
          <div class="alert-desc">命中時會發通知，並在報表標記。同一條件 60 分鐘內只通知一次。</div>
          <div id="alert-list"></div>
          <button type="button" id="alert-add">新增條件</button>
        </fieldset>
        <div id="preaction-section">
          <div class="preaction-title">前置動作</div>
          <div class="preaction-desc">抓取前依序執行，例如先關掉彈窗、或等圖表載入完成。</div>
          <div id="frame-hint" role="status" hidden>
            <div id="frame-hint-text"></div>
            <div id="frame-hint-actions">
              <button type="button" id="frame-hint-add">加入點擊步驟</button>
              <button type="button" id="frame-hint-dismiss">不需要</button>
            </div>
          </div>
          <div id="preaction-list"></div>
          <button type="button" id="preaction-add">新增動作</button>
        </div>
      </details>
    </div>
    <label class="checkbox-label">
      <input type="checkbox" id="pin-defaults">將此次設定固定為預設值
    </label>
    <div id="save-summary" hidden></div>
    <footer>
      <button type="button" id="test-now">立即測試</button>
      <button type="button" id="cancel">取消</button>
      <button type="button" id="save" class="btn-primary">儲存</button>
    </footer>
  </form>
</body>
</html>
