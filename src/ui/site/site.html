<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>站台登入設定</title>
  <link rel="stylesheet" href="../theme.css">
  <link rel="stylesheet" href="../ui.css">
  <style>
    body {
      padding: var(--space-3, 12px);
      width: 100%;
      box-sizing: border-box;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .risk-notice {
      margin-bottom: var(--space-2);
    }
    form {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
    }
    .settings-body {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: var(--space-2, 10px);
      padding-right: 2px;
    }
    .origin-box {
      padding: var(--space-1, 6px) var(--space-2, 8px);
      background: var(--hover);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: var(--text-sm, 13px);
      color: var(--text);
      word-break: break-all;
      min-height: 30px;
      display: flex;
      align-items: center;
    }
    .selector-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2, 8px);
      padding: var(--space-2, 8px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow-1);
    }
    .selector-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex: 1;
      min-width: 0;
    }
    .selector-label {
      font-size: var(--text-xs, 12px);
      font-weight: 600;
      color: var(--text);
    }
    .selector-value {
      font-size: var(--text-xs, 12px);
      color: var(--text-muted);
      font-family: var(--font-mono, monospace);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .site-note {
      font-size: var(--text-xs, 12px);
      color: var(--danger-text);
      min-height: 18px;
      white-space: pre-line;
    }
    .inline-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: var(--space-2, 8px);
    }
    .inline-row > input {
      flex: 1 1 160px;
      min-width: 0;
    }
    .test-steps {
      margin: 0;
      padding-left: var(--space-3, 12px);
      font-size: var(--text-xs, 12px);
      line-height: 1.5;
      color: var(--text);
    }
    .test-steps > li[data-ok="false"] { color: var(--danger-text); }
    .test-steps > li > svg { vertical-align: -2px; }
    .test-result {
      font-size: var(--text-xs, 12px);
      color: var(--text);
      white-space: pre-line;
    }
    .test-result[data-ok="true"] { color: var(--ok-text); }
    .test-result[data-ok="false"] { color: var(--danger-text); }
  </style>
  <script type="module" src="./site.js"></script>
</head>
<body>
  <h2>站台登入設定</h2>
  <div class="risk-notice banner is-warn">
    密碼會加密後存在本機，僅防誤讀、不防同機的惡意程式。
  </div>
  <form id="site-form" onsubmit="return false;">
    <div class="settings-body">
      <label>站台 Origin
        <div id="origin" class="origin-box"></div>
      </label>
      <label>登入頁網址
        <input type="text" id="login-url">
      </label>
      <label>帳號
        <input type="text" id="username">
      </label>
      <label>密碼（留空表示不變更）
        <input type="password" id="password">
      </label>
      <div class="selector-row">
        <div class="selector-info">
          <span class="selector-label">帳號欄位</span>
          <span class="selector-value" data-field="user">尚未選取</span>
        </div>
        <button type="button" id="pick-user-btn" data-action="pick-user">在頁面上選取</button>
      </div>
      <div class="selector-row">
        <div class="selector-info">
          <span class="selector-label">密碼欄位</span>
          <span class="selector-value" data-field="pass">尚未選取</span>
        </div>
        <button type="button" id="pick-pass-btn" data-action="pick-pass">在頁面上選取</button>
      </div>
      <div class="selector-row">
        <div class="selector-info">
          <span class="selector-label">送出按鈕</span>
          <span class="selector-value" data-field="submit">尚未選取</span>
        </div>
        <button type="button" id="pick-submit-btn" data-action="pick-submit">在頁面上選取</button>
      </div>
      <label>登入成功判定
        <select id="success-type">
          <option value="urlPrefix">網址開頭</option>
          <option value="element">元素存在</option>
        </select>
      </label>
      <label for="success-value">成功判定值（登入後才會出現的網址開頭或元素）</label>
      <div class="inline-row">
        <input type="text" id="success-value">
        <button type="button" id="use-current-url">用目前這一頁的網址</button>
      </div>
      <div class="field-hint">登入後在這一頁按這顆</div>
      <div class="inline-row">
        <button type="button" id="site-test-login">測試登入</button>
        <span class="field-hint">只在這台電腦上測試，不會儲存</span>
      </div>
      <ol id="test-login-steps" class="test-steps" hidden></ol>
      <div id="test-login-result" class="test-result" role="status" hidden></div>
      <div id="site-note" class="site-note"></div>
    </div>
    <!-- 「還不能儲存」的原因：緊貼固定列上方、在捲動區外（save-guard.js，與 Picker 同一套） -->
    <div id="site-errors" class="save-guard" role="alert" hidden></div>
    <footer>
      <button type="button" id="site-cancel">取消</button>
      <span id="site-missing" class="save-guard-count" hidden></span>
      <button type="button" id="site-save" class="btn-primary">儲存</button>
    </footer>
  </form>
</body>
</html>
