<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>站台登入設定</title>
  <link rel="stylesheet" href="../theme.css">
  <link rel="stylesheet" href="../ui.css">
  <style>
    body {
      padding: var(--space-3, 12px);
      width: 100%;
      box-sizing: border-box;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .risk-notice {
      padding: var(--space-2, 8px) var(--space-3, 10px);
      background: var(--hover);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: var(--text-xs, 12px);
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: var(--space-2);
    }
    form {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
    }
    .settings-body {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: var(--space-2, 10px);
      padding-right: 2px;
    }
    .origin-box {
      padding: var(--space-1, 6px) var(--space-2, 8px);
      background: var(--hover);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: var(--text-sm, 13px);
      color: var(--text);
      word-break: break-all;
      min-height: 30px;
      display: flex;
      align-items: center;
    }
    .selector-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2, 8px);
      padding: var(--space-2, 8px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow-1);
    }
    .selector-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex: 1;
      min-width: 0;
    }
    .selector-label {
      font-size: var(--text-xs, 12px);
      font-weight: 600;
      color: var(--text);
    }
    .selector-value {
      font-size: var(--text-xs, 12px);
      color: var(--text-muted);
      font-family: var(--font-mono, monospace);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .site-note {
      font-size: var(--text-xs, 12px);
      color: var(--danger);
      min-height: 18px;
      white-space: pre-line;
    }
  </style>
  <script type="module" src="./site.js"></script>
</head>
<body>
  <h2>站台登入設定</h2>
  <div class="risk-notice">
    密碼會加密後存在本機，僅防誤讀、不防同機的惡意程式。
  </div>
  <form id="site-form" onsubmit="return false;">
    <div class="settings-body">
      <label>站台 Origin
        <div id="origin" class="origin-box"></div>
      </label>
      <label>登入頁網址
        <input type="text" id="login-url">
      </label>
      <label>帳號
        <input type="text" id="username">
      </label>
      <label>密碼（留空表示不變更）
        <input type="password" id="password">
      </label>
      <div class="selector-row">
        <div class="selector-info">
          <span class="selector-label">帳號欄位</span>
          <span class="selector-value" data-field="user">尚未選取</span>
        </div>
        <button type="button" data-action="pick-user">在頁面上選取</button>
      </div>
      <div class="selector-row">
        <div class="selector-info">
          <span class="selector-label">密碼欄位</span>
          <span class="selector-value" data-field="pass">尚未選取</span>
        </div>
        <button type="button" data-action="pick-pass">在頁面上選取</button>
      </div>
      <div class="selector-row">
        <div class="selector-info">
          <span class="selector-label">送出按鈕</span>
          <span class="selector-value" data-field="submit">尚未選取</span>
        </div>
        <button type="button" data-action="pick-submit">在頁面上選取</button>
      </div>
      <label>登入成功判定
        <select id="success-type">
          <option value="urlPrefix">網址開頭</option>
          <option value="element">元素存在</option>
        </select>
      </label>
      <label>成功判定值
        <input type="text" id="success-value">
      </label>
      <div id="site-note" class="site-note"></div>
    </div>
    <footer>
      <button type="button" id="site-cancel">取消</button>
      <button type="button" id="site-save" class="btn-primary">儲存</button>
    </footer>
  </form>
</body>
</html>
